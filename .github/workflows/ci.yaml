name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE: ghcr.io/martinyonatann/platform-engineering-lab/nginx

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: phase-07-cicd/01-app/Dockerfile
      - uses: azure/setup-helm@v4
      - run: helm lint phase-05-helm/04-environments/nginx
      - run: helm template nginx phase-05-helm/04-environments/nginx -f phase-05-helm/04-environments/nginx/values-dev.yaml > /dev/null

  build:
    needs: lint
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: phase-07-cicd/01-app
          push: true
          build-args: GIT_SHA=${{ steps.vars.outputs.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ needs.build.outputs.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'